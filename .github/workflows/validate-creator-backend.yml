name: Validate Creator backend

on:
  push:
    branches: [feature/quick-login-coins-withdrawal]
    paths:
      - "functions/index.js"
      - "functions/package.json"
      - ".github/workflows/validate-creator-backend.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check functions/index.js
      - name: Verify Creator review endpoints are exported
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const source = fs.readFileSync("functions/index.js", "utf8");
          for (const name of ["reviewCreatorApplication", "setCreatorFaceVerification", "listCreatorApplicationsForAdmin"]) {
            if (!source.includes("exports." + name + " = onCall")) {
              console.error("Missing endpoint:", name);
              process.exit(1);
            }
          }
          console.log("Creator review endpoint declarations found.");
          NODE

name: Deploy Firebase Functions

on:
  workflow_dispatch:
    inputs:
      run_migration:
        description: "Run the legacy private-user-data migration after deployment (only after backup and review)"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'functions/**'
      - 'index.js'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Create Google credentials file
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Validate Cashfree secrets
        shell: bash
        env:
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
        run: |
          if [ -z "$CASHFREE_APP_ID" ] || [ -z "$CASHFREE_SECRET_KEY" ]; then
            echo "CASHFREE_APP_ID or CASHFREE_SECRET_KEY secret is missing"
            exit 1
          fi

      - name: Set Cashfree Firebase secrets
        shell: bash
        env:
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
        run: |
          printf '%s' "$CASHFREE_APP_ID" | firebase functions:secrets:set CASHFREE_APP_ID --project videocalllive-bcd7c --data-file=-
          printf '%s' "$CASHFREE_SECRET_KEY" | firebase functions:secrets:set CASHFREE_SECRET_KEY --project videocalllive-bcd7c --data-file=-

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions,firestore:rules --project videocalllive-bcd7c --non-interactive --force

      - name: Migrate legacy private user data
        if: github.event_name == 'workflow_dispatch' && inputs.run_migration == true
        working-directory: functions
        run: node migrate-private-user-data.js

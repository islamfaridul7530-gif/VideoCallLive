name: Build Video Call Live V15 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V15 project
        run: |
          unzip -q VideoCallLiveV15_PROFILE_SCROLL_BACK.zip -d buildproject
          cp google-services.json buildproject/VideoCallLiveV15_PROFILE_SCROLL_BACK/app/google-services.json
          ls -la buildproject/VideoCallLiveV15_PROFILE_SCROLL_BACK

      - name: Build V15 APK
        working-directory: buildproject/VideoCallLiveV15_PROFILE_SCROLL_BACK
        run: gradle :app:assembleDebug

      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV15_PROFILE_SCROLL_BACK
        run: gradle signingReport

      - name: Upload V15 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V15-APK
          path: buildproject/VideoCallLiveV15_PROFILE_SCROLL_BACK/app/build/outputs/apk/debug/app-debug.apk

name: Build Video Call Live APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V1 project
        run: |
          unzip -q VideoCallLiveV1.zip -d buildproject
          ls -la buildproject

      - name: Build APK
        working-directory: buildproject/VideoCallLiveV1
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V1-APK
          path: buildproject/VideoCallLiveV1/app/build/outputs/apk/debug/app-debug.apk

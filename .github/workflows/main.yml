name: Build V45 Admin Coins Fix

on:
  push:
    branches:
      - main
      - fix/payment-coin-balance
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V44 base project and apply V45 patch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "VideoCallLive-PAYMENT-TEST-15-FINAL.zip" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          cp -f v45_patch/app/build.gradle "$PROJECT_DIR/app/build.gradle"
          cp -f v45_patch/app/src/main/AndroidManifest.xml "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          # FIX: keep the launch screen visible while asynchronous Firestore profile restore runs.
          # Previously MainActivity returned before setContentView; if Firestore failed, users saw a blank white screen.
          python3 - <<'PY'
          from pathlib import Path
          p = next(Path("extracted").rglob("MainActivity.java"), None)
          if p is None:
              raise SystemExit("MainActivity.java not found under extracted V44 project")
          s = p.read_text()
          old = "                FirebaseHelper.restoreProfile(this);\n                return;"
          new = "                FirebaseHelper.restoreProfile(this);"
          if old not in s:
              raise SystemExit("Expected MainActivity restoreProfile block not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1))
          print("Applied startup white-screen fix to MainActivity.java")
          PY
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/videocalllive/app"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/CreatorApplicationActivity.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/CreatorApplicationActivity.java"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/TopUpActivity.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/TopUpActivity.java"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/Ui.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/Ui.java"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/AdminReviewActivity.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/AdminReviewActivity.java"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"
          echo "V45 patch applied:"
          grep -n "versionName" "$PROJECT_DIR/app/build.gradle"
          grep -n "AdminReviewActivity" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -n "OWNER_ADMIN_UID" "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/CreatorApplicationActivity.java"
          grep -n "Coins purchase is available only" "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/TopUpActivity.java"

      - name: Patch Android coin balance and remove ₹15 test pack
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_android_coin_balance.py "$PROJECT_DIR"

      - name: Inspect Android payment and coin-balance flow
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Android source files ==="
          find "$PROJECT_DIR/app/src" -type f \( -name '*.kt' -o -name '*.java' -o -name '*.xml' \) | sort | grep -Ei 'coin|payment|wallet|profile|home|firebase|main|activity|fragment' | head -120 || true
          echo "=== Payment/balance references ==="
          grep -RniE -C 4 'createCashfreeOrder|verifyCashfreePayment|getCoinBalance|paymentSessionId|coinBalance|CoinBalance|coins|Cashfree|Payment' "$PROJECT_DIR/app/src" --include='*.kt' --include='*.java' --include='*.xml' | head -650 || true

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "UNSIGNED_APK=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" signed/VideoCallLive-V45-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign             --ks "$RUNNER_TEMP/release.keystore"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out signed/VideoCallLive-V45.apk             signed/VideoCallLive-V45-aligned.apk

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose signed/VideoCallLive-V45.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V45-Admin-Coins-Fix
          path: signed/VideoCallLive-V45.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package patched Android source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/VideoCallLive-Android-Source-Patched.zip" . -x "*/build/*" "*/.gradle/*" ".gradle/*"

      - name: Upload patched Android source
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-Android-Source-Patched
          path: VideoCallLive-Android-Source-Patched.zip
          if-no-files-found: error
          retention-days: 30

name: Check Video Call Live V8 ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check V8 ZIP contents
        run: |
          echo "===== V8 ZIP CONTENTS ====="
          unzip -l VideoCallLiveV8_SESSION_CREATOR.zip
          echo "===== EXTRACTING ====="
          mkdir -p buildproject
          unzip -q VideoCallLiveV8_SESSION_CREATOR.zip -d buildproject
          echo "===== FOLDERS AFTER EXTRACT ====="
          find buildproject -maxdepth 3 -type d -print

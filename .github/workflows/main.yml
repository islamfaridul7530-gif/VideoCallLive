
name: Build Video Call Live V31 Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VideoCallLiveV31*.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V31 project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buildproject
          shopt -s nullglob
          zips=(VideoCallLiveV31*.zip)
          test "${#zips[@]}" -eq 1
          unzip -q "${zips[0]}" -d buildproject
          mapfile -t projects < <(find buildproject -type f -path '*/app/build.gradle' -printf '%h\n')
          test "${#projects[@]}" -eq 1
          PROJECT_DIR="${projects[0]%/app}"
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Configure release signing
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle"
          code = p.read_text()

          assert "android {" in code, "Android block not found"
          assert "signingConfigs" not in code, "Signing already configured"
          assert "buildTypes" not in code, "Build types already configured"

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          """

          code = code.replace("android {", "android {" + signing, 1)
          p.write_text(code)
          print("Release signing configured.")
          PY

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V31-Signed-Release-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


name: Build Video Call Live V20 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VideoCallLiveV20_REAL_VIDEO_CALL.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V20 project
        run: |
          rm -rf buildproject
          mkdir buildproject
          unzip -q VideoCallLiveV20_REAL_VIDEO_CALL.zip -d buildproject
          find buildproject -maxdepth 3 -type f | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed Release APK
        working-directory: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace

      - name: Check signed APK
        working-directory: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL
        run: |
          ls -lh app/build/outputs/apk/release/
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V20-Signed-Release-APK
          path: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

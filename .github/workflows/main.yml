name: Build V49 Account Isolation Chat Fix and ARM Size Optimization

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V44 base project and apply V45 patch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "VideoCallLive-PAYMENT-TEST-15-FINAL.zip" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          cp -f v45_patch/app/build.gradle "$PROJECT_DIR/app/build.gradle"
          cp -f v45_patch/app/src/main/AndroidManifest.xml "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          # FIX: keep the launch screen visible while asynchronous Firestore profile restore runs.
          # Previously MainActivity returned before setContentView; if Firestore failed, users saw a blank white screen.
          python3 - <<'PY'
          from pathlib import Path
          p = next(Path("extracted").rglob("MainActivity.java"), None)
          if p is None:
              raise SystemExit("MainActivity.java not found under extracted V44 project")
          s = p.read_text()
          old = "                FirebaseHelper.restoreProfile(this);\n                return;"
          new = "                FirebaseHelper.restoreProfile(this);"
          if old not in s:
              raise SystemExit("Expected MainActivity restoreProfile block not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1))
          print("Applied startup white-screen fix to MainActivity.java")
          PY
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/videocalllive/app"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/CreatorApplicationActivity.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/CreatorApplicationActivity.java"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/TopUpActivity.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/TopUpActivity.java"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/Ui.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/Ui.java"
          cp -f v45_patch/app/src/main/java/com/videocalllive/app/AdminReviewActivity.java "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/AdminReviewActivity.java"

          # V46: increment the Android version and fix duplicated own-profile images in Home.
          sed -i 's/versionCode 45/versionCode 46/; s/versionName "45.0-creator-verification"/versionName "46.0-profile-dedup-chat-rules"/' "$PROJECT_DIR/app/build.gradle"
          python3 - <<'PY'
          from pathlib import Path
          p = next(Path("extracted").rglob("HomeActivity.java"), None)
          if p is None:
              raise SystemExit("HomeActivity.java not found; refusing unsafe V46 patch")
          s = p.read_text()
          old_fields = 'List<DocumentSnapshot> profiles=new ArrayList<>();String term="",me,gender,tab="Popular";'
          new_fields = 'List<DocumentSnapshot> profiles=new ArrayList<>();String myPhotoData="",myPhotoUrl="";String term="",me,gender,tab="Popular";'
          if old_fields not in s:
              raise SystemExit("HomeActivity fields did not match expected V45 source")
          s = s.replace(old_fields, new_fields, 1)
          old_listener = 'db.collection("users").document(me).addSnapshotListener((d,e)->{if(d!=null&&d.exists()&&balance!=null){Long coins=d.getLong("coinBalance");balance.setText("🪙 "+(coins==null?"--":coins)+"  +");}});'
          new_listener = 'db.collection("users").document(me).addSnapshotListener((d,e)->{if(d!=null&&d.exists()){myPhotoData=d.getString("photoData");myPhotoUrl=d.getString("photoUrl");if(balance!=null){Long coins=d.getLong("coinBalance");balance.setText("🪙 "+(coins==null?"--":coins)+"  +");}render();}});'
          if old_listener not in s:
              raise SystemExit("HomeActivity current-user listener did not match expected V45 source")
          s = s.replace(old_listener, new_listener, 1)
          old_valid = 'boolean valid(DocumentSnapshot d){if(d.getId().equals(me))return false;String g=d.getString("gender");return g!=null&&!g.equals(gender)&&("male".equals(g)||"female".equals(g));}'
          new_valid = 'boolean valid(DocumentSnapshot d){if(d.getId().equals(me))return false;String g=d.getString("gender");if(g==null||g.equals(gender)||!("male".equals(g)||"female".equals(g)))return false;String pd=d.getString("photoData"),pu=d.getString("photoUrl");if(samePhoto(myPhotoData,pd)||samePhoto(myPhotoUrl,pu))return false;return true;} boolean samePhoto(String a,String b){return a!=null&&!a.trim().isEmpty()&&b!=null&&!b.trim().isEmpty()&&a.equals(b);} String photoKey(DocumentSnapshot d){String u=d.getString("photoUrl");if(u!=null&&!u.trim().isEmpty())return "url:"+u;String p=d.getString("photoData");if(p!=null&&!p.trim().isEmpty())return "data:"+p;return ""; }'
          if old_valid not in s:
              raise SystemExit("HomeActivity valid() did not match expected V45 source")
          s = s.replace(old_valid, new_valid, 1)
          old_loop = 'void render(){if(list==null)return;list.removeAllViews();List<DocumentSnapshot> show=new ArrayList<>();for(DocumentSnapshot d:profiles){if(!valid(d))continue;String n=name(d),id=d.getId();'
          new_loop = 'void render(){if(list==null)return;list.removeAllViews();List<DocumentSnapshot> show=new ArrayList<>();Set<String> seenPhotoKeys=new HashSet<>();for(DocumentSnapshot d:profiles){if(!valid(d))continue;String pk=photoKey(d);if(!pk.isEmpty()&&!seenPhotoKeys.add(pk))continue;String n=name(d),id=d.getId();'
          if old_loop not in s:
              raise SystemExit("HomeActivity render loop did not match expected V45 source")
          s = s.replace(old_loop, new_loop, 1)
          p.write_text(s)
          print("V46 Home profile dedup patch applied")
          PY

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"
          echo "V45 patch applied:"
          grep -n "versionName" "$PROJECT_DIR/app/build.gradle"
          grep -n "AdminReviewActivity" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -n "OWNER_ADMIN_UID" "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/CreatorApplicationActivity.java"
          grep -n "Coins purchase is available only" "$PROJECT_DIR/app/src/main/java/com/videocalllive/app/TopUpActivity.java"

      - name: Apply V47 chat initialization and diagnostics fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("extracted")
          chat = next(root.rglob("ChatActivity.java"), None)
          messages = next(root.rglob("MessagesActivity.java"), None)
          gradle = next(root.rglob("app/build.gradle"), None)
          if not chat or not messages or not gradle:
              raise SystemExit("V47 patch source files not found")
          g = gradle.read_text()
          if 'versionCode 46' not in g or 'versionName "46.0-profile-dedup-chat-rules"' not in g:
              raise SystemExit("Expected V46 version markers not found")
          gradle.write_text(g.replace('versionCode 46', 'versionCode 47', 1).replace('versionName "46.0-profile-dedup-chat-rules"', 'versionName "47.0-chat-initialization-fix"', 1))

          s = chat.read_text()
          old = 'send.setOnClickListener(v->send());reg=db.collection("chats").document(room).collection("messages").orderBy("createdAt",Query.Direction.ASCENDING).limitToLast(150).addSnapshotListener((q,e)->{if(e!=null){Ui.toast(this,"Chat unavailable: "+e.getMessage());return;}if(q==null)return;lastMessages=q;renderMessages();});'
          new = '''send.setOnClickListener(v->send());
          // Ensure the parent chat document exists before listening to its messages.
          // Firestore message rules read the parent chat to verify participants.
          Map<String,Object> initialChat=new HashMap<>();
          initialChat.put("participants",Arrays.asList(me,other));
          initialChat.put("updatedAt",System.currentTimeMillis());
          db.collection("chats").document(room).set(initialChat,SetOptions.merge())
            .addOnSuccessListener(x->{
              if(isFinishing()||isDestroyed())return;
              reg=db.collection("chats").document(room).collection("messages")
                .orderBy("createdAt",Query.Direction.ASCENDING).limitToLast(150)
                .addSnapshotListener((q,e)->{
                  if(e!=null){Ui.toast(this,"Chat unavailable ("+e.getCode()+"): "+e.getMessage());return;}
                  if(q==null)return;lastMessages=q;renderMessages();
                });
            })
            .addOnFailureListener(e->Ui.toast(this,"Chat setup failed: "+e.getMessage()));'''
          if old not in s:
              raise SystemExit("ChatActivity message listener block did not match expected source")
          chat.write_text(s.replace(old,new,1))

          s = messages.read_text()
          old = 'list.addView(Ui.body(this,"Unable to load chats: "+e.getMessage()));'
          new = 'list.addView(Ui.body(this,"Unable to load chats ("+e.getCode()+"): "+e.getMessage()+"\\nFirebase project: "+com.google.firebase.FirebaseApp.getInstance().getOptions().getProjectId()));'
          if old not in s:
              raise SystemExit("MessagesActivity error text did not match expected source")
          messages.write_text(s.replace(old,new,1))
          print("V47: parent chat is initialized before messages listener; permission error includes code and Firebase project ID.")
          PY
          sed -i 's/VideoCallLive-V46-aligned.apk/VideoCallLive-V49-aligned.apk/g; s/VideoCallLive-V46.apk/VideoCallLive-V49.apk/g' .github/workflows/main.yml

      - name: Apply V48 APK size optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          gradle = next(Path("extracted").rglob("app/build.gradle"), None)
          if not gradle:
              raise SystemExit("app/build.gradle not found")
          s = gradle.read_text()
          if 'versionCode 47' not in s or 'versionName "47.0-chat-initialization-fix"' not in s:
              raise SystemExit("Expected V47 version markers not found")
          s = s.replace('versionCode 47', 'versionCode 48', 1)
          s = s.replace('versionName "47.0-chat-initialization-fix"', 'versionName "48.0-arm-apk-size-optimization"', 1)
          needle = ' defaultConfig {\n  applicationId'
          replacement = ' defaultConfig {\n  ndk { abiFilters "arm64-v8a", "armeabi-v7a" }\n  applicationId'
          if needle not in s:
              raise SystemExit("Could not safely add ARM ABI filters")
          s = s.replace(needle, replacement, 1)
          gradle.write_text(s)
          print("V48: APK will include ARM64 and ARMv7 native libraries only.")
          PY
          mkdir -p /tmp/videocalllive-source
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("extracted")
          src = next(root.rglob("app/src/main/java"), None)
          gradle = next(root.rglob("app/build.gradle"), None)
          if not src or not gradle:
              raise SystemExit("Source directory or build.gradle not found")
          out = Path("/tmp/VideoCallLive-V49-Source-Diagnostics.zip")
          with ZipFile(out, "w", ZIP_DEFLATED) as z:
              for p in src.rglob("*.java"):
                  z.write(p, p.relative_to(src.parent.parent.parent))
              z.write(gradle, "app/build.gradle")
          print(f"Created source diagnostic archive: {out}")
          PY

      - name: Apply V49 account isolation, startup, and chat diagnostics fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("extracted")
          def find(name):
              p = next(root.rglob(name), None)
              if p is None:
                  raise SystemExit(f"{name} not found; refusing unsafe patch")
              return p

          gradle = next(root.rglob("app/build.gradle"), None)
          if gradle is None:
              raise SystemExit("app/build.gradle not found")
          g = gradle.read_text()
          if 'versionCode 48' not in g or 'versionName "48.0-arm-apk-size-optimization"' not in g:
              raise SystemExit("Expected V48 version markers not found")
          g = g.replace('versionCode 48', 'versionCode 49', 1)
          g = g.replace('versionName "48.0-arm-apk-size-optimization"', 'versionName "49.0-account-isolation-chat-fix"', 1)
          gradle.write_text(g)

          # Do not briefly show the login options while a saved Firebase account is being restored.
          p = find("MainActivity.java")
          s = p.read_text()
          old = '''if (FirebaseHelper.ready(this) && FirebaseAuth.getInstance().getCurrentUser() != null) {
                  FirebaseHelper.restoreProfile(this);
              }'''
          new = '''if (FirebaseHelper.ready(this) && FirebaseAuth.getInstance().getCurrentUser() != null) {
                  showRestoreLoading();
                  FirebaseHelper.restoreProfile(this);
                  return;
              }'''
          if old not in s:
              raise SystemExit("MainActivity saved-session block did not match")
          s = s.replace(old, new, 1)
          marker = '    private void saveAndShow(Throwable e) {'
          methods = '''    private void showRestoreLoading() {
            LinearLayout r = Ui.root(this);
            r.addView(Ui.title(this, "Video Call Live"));
            r.addView(Ui.body(this, "Restoring your saved account..."));
            Button retry = Ui.button(this, "Retry");
            retry.setOnClickListener(v -> FirebaseHelper.restoreProfile(this));
            Button switchAccount = Ui.secondary(this, "Sign out and Login");
            switchAccount.setOnClickListener(v -> {
                FirebaseAuth.getInstance().signOut();
                getSharedPreferences("vcl", 0).edit()
                    .remove("account_uid").remove("gender").remove("profile_name")
                    .remove("profile_country").remove("profile_bio").remove("profile_age")
                    .remove("profile_complete_local").apply();
                startActivity(new Intent(this, MainActivity.class));
                finish();
            });
            r.addView(retry);
            r.addView(switchAccount);
            setContentView(r);
        }

        private void clearOldProfileCache() {
            getSharedPreferences("vcl", 0).edit()
                .remove("account_uid").remove("gender").remove("profile_name")
                .remove("profile_country").remove("profile_bio").remove("profile_age")
                .remove("profile_complete_local").remove("creator_status")
                .remove("creator_name").remove("creator_country").remove("creator_bio")
                .remove("creator_rate").remove("creator_profile_complete").apply();
        }

'''
          if marker not in s:
              raise SystemExit("MainActivity insertion point missing")
          s = s.replace(marker, methods + marker, 1)
          oldq = '''getSharedPreferences("vcl",0).edit().putBoolean("quick",true).apply();
                            startActivity(new Intent(this, GenderActivity.class));'''
          newq = '''clearOldProfileCache();
                            getSharedPreferences("vcl",0).edit().putBoolean("quick",true).apply();
                            startActivity(new Intent(this, GenderActivity.class));'''
          if oldq not in s:
              raise SystemExit("MainActivity Quick Login cache block did not match")
          s = s.replace(oldq, newq, 1)
          p.write_text(s)

          # Every profile restore clears global profile fields first so a previous account cannot leak into the next one.
          p = find("FirebaseHelper.java")
          s = p.read_text()
          old = '''  String uid=FirebaseAuth.getInstance().getUid();
  FirebaseFirestore.getInstance().collection("users").document(uid).get()'''
          new = '''  String uid=FirebaseAuth.getInstance().getUid();
  a.getSharedPreferences("vcl",0).edit()
   .remove("account_uid").remove("gender").remove("profile_name")
   .remove("profile_country").remove("profile_bio").remove("profile_age")
   .remove("profile_complete_local").remove("creator_status")
   .remove("creator_name").remove("creator_country").remove("creator_bio")
   .remove("creator_rate").remove("creator_profile_complete").apply();
  FirebaseFirestore.getInstance().collection("users").document(uid).get()'''
          if old not in s:
              raise SystemExit("FirebaseHelper restoreProfile insertion point missing")
          p.write_text(s.replace(old, new, 1))

          # Keep local photo lists under the signed-in UID, not one shared key for every account on this phone.
          p = find("PhotoManagerActivity.java")
          s = p.read_text()
          old = ''' ArrayList<String> getPhotos(){ArrayList<String>a=new ArrayList<>();String s=p.getString("profile_photos","");if(!s.isEmpty())for(String x:s.split("\\\\|\\\\|"))if(!x.isEmpty())a.add(x);return a;}
 void save(ArrayList<String>a){StringBuilder s=new StringBuilder();for(String x:a){if(s.length()>0)s.append("||");s.append(x);}p.edit().putString("profile_photos",s.toString()).apply();}'''
          new = ''' String photosKey(){String uid=FirebaseAuth.getInstance().getUid();return uid==null?"profile_photos_unassigned":"profile_photos_"+uid;}
 ArrayList<String> getPhotos(){ArrayList<String>a=new ArrayList<>();String s=p.getString(photosKey(),"");if(!s.isEmpty())for(String x:s.split("\\\\|\\\\|"))if(!x.isEmpty())a.add(x);return a;}
 void save(ArrayList<String>a){StringBuilder s=new StringBuilder();for(String x:a){if(s.length()>0)s.append("||");s.append(x);}p.edit().putString(photosKey(),s.toString()).apply();}'''
          if old not in s:
              raise SystemExit("PhotoManagerActivity photo preference block did not match")
          p.write_text(s.replace(old, new, 1))

          p = find("MyProfileActivity.java")
          s = p.read_text()
          old = ''' ArrayList<String> photos(){ArrayList<String>a=new ArrayList<>();String s=p.getString("profile_photos","");if(!s.isEmpty())for(String x:s.split("\\\\|\\\\|"))if(!x.isEmpty())a.add(x);return a;}'''
          new = ''' ArrayList<String> photos(){ArrayList<String>a=new ArrayList<>();String uid=FirebaseAuth.getInstance().getUid();String s=p.getString(uid==null?"profile_photos_unassigned":"profile_photos_"+uid,"");if(!s.isEmpty())for(String x:s.split("\\\\|\\\\|"))if(!x.isEmpty())a.add(x);return a;}'''
          if old not in s:
              raise SystemExit("MyProfileActivity photo preference block did not match")
          p.write_text(s.replace(old, new, 1))

          p = find("ProfilePhotoSync.java")
          s = p.read_text()
          old = 'String all=p.getString("profile_photos","");'
          new = 'String all=p.getString("profile_photos_"+uid,"");'
          if old not in s:
              raise SystemExit("ProfilePhotoSync shared photo key did not match")
          p.write_text(s.replace(old, new, 1))

          # Include the authenticated UID in the permission error so the deployed rule mismatch can be diagnosed.
          p = find("MessagesActivity.java")
          s = p.read_text()
          old = '''"Unable to load chats ("+e.getCode()+"): "+e.getMessage()+"\\nFirebase project: "+com.google.firebase.FirebaseApp.getInstance().getOptions().getProjectId()'''
          new = '''"Unable to load chats ("+e.getCode()+"): "+e.getMessage()+"\\nUID: "+uid+"\\nFirebase project: "+com.google.firebase.FirebaseApp.getInstance().getOptions().getProjectId()'''
          if old not in s:
              raise SystemExit("MessagesActivity diagnostic text did not match")
          p.write_text(s.replace(old, new, 1))

          p = find("ChatActivity.java")
          s = p.read_text()
          old = 'Ui.toast(this,"Chat setup failed: "+e.getMessage())'
          new = 'Ui.toast(this,"Chat setup failed ("+e.getCode()+"): "+e.getMessage()+" UID="+me+" room="+room)'
          if old not in s:
              raise SystemExit("ChatActivity setup diagnostic did not match")
          p.write_text(s.replace(old, new, 1))
          print("V49 account-scoped photo storage, clean account restore, startup loading screen, and UID chat diagnostics applied.")
          PY
          sed -i 's/VideoCallLive-V47-aligned.apk/VideoCallLive-V49-aligned.apk/g; s/VideoCallLive-V47.apk/VideoCallLive-V49.apk/g' .github/workflows/main.yml

      - name: Upload source diagnostics for code review
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V49-Source-Diagnostics
          path: /tmp/VideoCallLive-V49-Source-Diagnostics.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "UNSIGNED_APK=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" signed/VideoCallLive-V49-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign             --ks "$RUNNER_TEMP/release.keystore"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out signed/VideoCallLive-V49.apk             signed/VideoCallLive-V49-aligned.apk

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose signed/VideoCallLive-V49.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V49-Account-Isolation-Chat-Fix
          path: signed/VideoCallLive-V49.apk
          if-no-files-found: error
          retention-days: 30

name: Build V44 Video Quality

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V44 Video Quality Project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "VideoCallLiveV44_VIDEO_QUALITY.zip" -d extracted

          PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean assembleRelease

          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "UNSIGNED_APK=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p signed

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$BUILD_TOOLS_DIR/zipalign" \
            -f -p 4 \
            "$UNSIGNED_APK" \
            signed/VideoCallLive-V44-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out signed/VideoCallLive-V44.apk \
            signed/VideoCallLive-V44-aligned.apk

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose \
            signed/VideoCallLive-V44.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V44-Video-Quality
          path: signed/VideoCallLive-V44.apk
          if-no-files-found: error
          retention-days: 30

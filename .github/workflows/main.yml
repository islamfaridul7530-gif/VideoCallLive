name: Build Video Call Live V20 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VideoCallLiveV20_REAL_VIDEO_CALL.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V20 project
        run: |
          rm -rf buildproject
          mkdir buildproject
          unzip -q VideoCallLiveV20_REAL_VIDEO_CALL.zip -d buildproject
          find buildproject -maxdepth 3 -type f | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build V20 APK
        working-directory: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL
        run: gradle assembleDebug --stacktrace

      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL
        run: gradle signingReport

      - name: Upload V20 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V20-APK
          path: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL/app/build/outputs/apk/debug/app-debug.apk

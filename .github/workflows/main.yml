          set +o pipefail
          mkdir -p /tmp/android-sdk-diagnostics
          LOG=/tmp/android-sdk-diagnostics/sdkmanager.txt
          {
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "SDK_ROOT=$SDK_ROOT"
            echo "SDK directories:"
            ls -la "$SDK_ROOT" 2>&1
            echo "sdkmanager candidates:"
            find "$SDK_ROOT" /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | sort -V
            echo "Installed platform folders:"
            ls -la "$SDK_ROOT/platforms" 2>&1
            echo "Installed build-tools folders:"
            ls -la "$SDK_ROOT/build-tools" 2>&1
            SDKMANAGER="$(find "$SDK_ROOT" /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "SDKMANAGER_NOT_FOUND"
            else
              echo "Using sdkmanager: $SDKMANAGER"
              set +e
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
              echo "LICENSE_EXIT=$?"
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

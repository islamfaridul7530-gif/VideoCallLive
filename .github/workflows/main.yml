name: Build Video Call Live V16 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V16 project
        run: |
          unzip -q VideoCallLiveV16_LOCAL_FEATURES.zip -d buildproject
          cp google-services.json buildproject/VideoCallLiveV16_LOCAL_FEATURES/app/google-services.json
          ls -la buildproject/VideoCallLiveV16_LOCAL_FEATURES

      - name: Build V16 APK
        working-directory: buildproject/VideoCallLiveV16_LOCAL_FEATURES
        run: gradle :app:assembleDebug

      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV16_LOCAL_FEATURES
        run: gradle signingReport

      - name: Upload V16 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V16-APK
          path: buildproject/VideoCallLiveV16_LOCAL_FEATURES/app/build/outputs/apk/debug/app-debug.apk

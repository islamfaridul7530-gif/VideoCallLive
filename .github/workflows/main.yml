
name: Build Video Call Live V22 Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VideoCallLiveV22*.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V22 project
        shell: bash
        run: |
          set -e
          mkdir -p buildproject
          shopt -s nullglob
          zips=(VideoCallLiveV22*.zip)
          test "${#zips[@]}" -eq 1
          unzip -q "${zips[0]}" -d buildproject

          mapfile -t projects < <(find buildproject -type f -path '*/app/build.gradle' -printf '%h\n')
          test "${#projects[@]}" -eq 1

          PROJECT_DIR="${projects[0]%/app}"
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Configure release signing
        run: |
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          code = p.read_text()

          assert "android {" in code, "Android block not found"
          assert "signingConfigs" not in code, "Signing config already exists"
          assert "buildTypes" not in code, "Build types already exist"

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }

          """

          code = code.replace("android {", "android {\\n" + signing, 1)
          p.write_text(code)
          print("Release signing configuration added.")
          PY

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace

      - name: Verify signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

          echo "===== APK CERTIFICATE ====="
          "$APKSIGNER" verify --print-certs "$APK"

          echo "===== KEYSTORE SHA-1 AND SHA-256 ====="
          keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E 'SHA1:|SHA256:'

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V22-Signed-Release-APK
          path: buildproject/**/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            echo "SDK_ROOT=$SDK_ROOT"
            echo "SDK directories:"
            ls -la "$SDK_ROOT" 2>&1
            echo "sdkmanager candidates:"
            find "$SDK_ROOT" /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | sort -V
            echo "Installed platform folders:"
            ls -la "$SDK_ROOT/platforms" 2>&1
            echo "Installed build-tools folders:"
            ls -la "$SDK_ROOT/build-tools" 2>&1
            SDKMANAGER="$(find "$SDK_ROOT" /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "SDKMANAGER_NOT_FOUND"
            else
              echo "Using sdkmanager: $SDKMANAGER"
              set +e
              yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
              echo "LICENSE_EXIT=$?"
              "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
              echo "INSTALL_EXIT=$?"
            fi
          } > "$LOG" 2>&1
          cat "$LOG"

      - name: Upload Android SDK diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V71-Android-SDK-Diagnostics
          path: /tmp/android-sdk-diagnostics/sdkmanager.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload source diagnostics for code review
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V71-Source-Diagnostics
          path: /tmp/VideoCallLive-V71-Source-Diagnostics.zip
          if-no-files-found: error
          retention-days: 7

      - name: Fix Firebase Follow and Followed tab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("extracted")
          profile = next(root.rglob("PublicProfileActivity.java"), None)
          home = next(root.rglob("HomeActivity.java"), None)
          if profile is None or home is None:
              raise SystemExit("Profile/Home source missing; refusing Follow patch")

          ps = profile.read_text()
          old = 'Button follow=Ui.button(this,"♡ Follow / Unfollow");content.addView(follow);follow.setOnClickListener(v->{if(key.isEmpty())return;DocumentReference ref=db.collection("users").document(key).collection("following").document(id);ref.get().addOnSuccessListener(d->{if(d.exists())ref.delete().addOnSuccessListener(x->Ui.toast(this,"Unfollowed"));else ref.set(Collections.singletonMap("followedAt",System.currentTimeMillis())).addOnSuccessListener(x->Ui.toast(this,"Following"));});});'
          new = 'Button follow=Ui.button(this,"♡ Follow");content.addView(follow);DocumentReference followRef=key.isEmpty()?null:db.collection("users").document(key).collection("following").document(id);if(followRef!=null)followRef.get().addOnSuccessListener(d->follow.setText(d.exists()?"♥ Following":"♡ Follow")).addOnFailureListener(e->Ui.toast(this,"Could not load follow status: "+e.getMessage()));follow.setEnabled(followRef!=null&&!key.equals(id));follow.setOnClickListener(v->{if(followRef==null||key.equals(id)){Ui.toast(this,"Please sign in to follow users");return;}follow.setEnabled(false);followRef.get().addOnSuccessListener(d->{if(d.exists())followRef.delete().addOnSuccessListener(x->{follow.setText("♡ Follow");Ui.toast(this,"Unfollowed");}).addOnFailureListener(e->Ui.toast(this,"Unfollow failed: "+e.getMessage())).addOnCompleteListener(t->follow.setEnabled(true));else followRef.set(Collections.singletonMap("followedAt",System.currentTimeMillis())).addOnSuccessListener(x->{follow.setText("♥ Following");Ui.toast(this,"Following");}).addOnFailureListener(e->Ui.toast(this,"Follow failed: "+e.getMessage())).addOnCompleteListener(t->follow.setEnabled(true));}).addOnFailureListener(e->{Ui.toast(this,"Follow error: "+e.getMessage());follow.setEnabled(true);});});'
          if old not in ps:
              raise SystemExit("Follow button source did not match expected V72 code; refusing patch")
          profile.write_text(ps.replace(old, new, 1))

          hs = home.read_text()
          old_fields = 'ListenerRegistration usersReg,callsReg;List<DocumentSnapshot> profiles=new ArrayList<>();'
          new_fields = 'ListenerRegistration usersReg,callsReg,followingReg;Set<String> followingIds=new HashSet<>();List<DocumentSnapshot> profiles=new ArrayList<>();'
          if old_fields not in hs:
              raise SystemExit("HomeActivity listener fields did not match; refusing patch")
          hs = hs.replace(old_fields, new_fields, 1)

          old_listen = 'db.collection("users").document(me).addSnapshotListener((d,e)->{'
          new_listen = 'followingReg=db.collection("users").document(me).collection("following").addSnapshotListener((q,e)->{if(e!=null){android.util.Log.e("VideoCallLive","Following listener failed",e);return;}followingIds.clear();if(q!=null)for(DocumentSnapshot f:q.getDocuments())followingIds.add(f.getId());render();});db.collection("users").document(me).addSnapshotListener((d,e)->{'
          if old_listen not in hs:
              raise SystemExit("HomeActivity listen() source did not match; refusing patch")
          hs = hs.replace(old_listen, new_listen, 1)

          old_filter = 'if("Followed".equals(tab)&&!getSharedPreferences("vcl",0).getBoolean("follow_uid_"+id,false))continue;'
          new_filter = 'if("Followed".equals(tab)&&!followingIds.contains(id))continue;'
          if old_filter not in hs:
              raise SystemExit("Followed tab filter did not match; refusing patch")
          hs = hs.replace(old_filter, new_filter, 1)

          old_destroy = 'protected void onDestroy(){if(usersReg!=null)usersReg.remove();if(callsReg!=null)callsReg.remove();super.onDestroy();}'
          new_destroy = 'protected void onDestroy(){if(usersReg!=null)usersReg.remove();if(callsReg!=null)callsReg.remove();if(followingReg!=null)followingReg.remove();super.onDestroy();}'
          if old_destroy not in hs:
              raise SystemExit("HomeActivity onDestroy source did not match; refusing patch")
          hs = hs.replace(old_destroy, new_destroy, 1)
          home.write_text(hs)
          print("Follow now saves/removes Firebase following documents; Followed tab listens to the same collection.")
          PY

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleRelease bundleRelease
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            find app/build/outputs -type f || true
            exit 1
          fi
          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB not found"
            find app/build/outputs -type f || true
            exit 1
          fi
          echo "UNSIGNED_APK=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
          echo "UNSIGNED_AAB=$PROJECT_DIR/$AAB" >> "$GITHUB_ENV"
          echo "APK found: $APK"
          echo "AAB found: $AAB"

      - name: Restore signing keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Sign APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" signed/VideoCallLive-V71-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign             --ks "$RUNNER_TEMP/release.keystore"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out signed/VideoCallLive-V71.apk             signed/VideoCallLive-V71-aligned.apk

      - name: Sign Android App Bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp "$UNSIGNED_AAB" signed/VideoCallLive-V71.aab
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" signed/VideoCallLive-V71.aab "$KEY_ALIAS"

      - name: Verify signed Android App Bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -verbose signed/VideoCallLive-V71.aab > /tmp/aab-verify.txt 2>&1
          cat /tmp/aab-verify.txt | tail -30
          if ! grep -qi "jar verified" /tmp/aab-verify.txt; then
            echo "ERROR: jarsigner did not confirm the AAB signature"
            exit 1
          fi
          echo "AAB signature verified"

      - name: Verify signed APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose signed/VideoCallLive-V71.apk

      - name: Upload signed APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V71-APK
          path: signed/VideoCallLive-V71.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed AAB for Google Play Console
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V71-Play-Store-AAB
          path: signed/VideoCallLive-V71.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish V71 APK as GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v71
          name: VideoCallLive V71
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: signed/VideoCallLive-V71.apk



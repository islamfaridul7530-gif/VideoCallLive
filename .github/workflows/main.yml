name: Build Video Call Live V19 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V19 project
        run: |
          unzip -q VideoCallLiveV19_CALLING_SAFETY_UPGRADE.zip -d buildproject
          cp google-services.json buildproject/VideoCallLiveV19_CALLING_SAFETY_UPGRADE/app/google-services.json
          ls -la buildproject/VideoCallLiveV19_CALLING_SAFETY_UPGRADE

      - name: Build V19 APK
        working-directory: buildproject/VideoCallLiveV19_CALLING_SAFETY_UPGRADE
        run: gradle :app:assembleDebug

      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV19_CALLING_SAFETY_UPGRADE
        run: gradle signingReport

      - name: Upload V19 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V19-APK
          path: buildproject/VideoCallLiveV19_CALLING_SAFETY_UPGRADE/app/build/outputs/apk/debug/app-debug.apk

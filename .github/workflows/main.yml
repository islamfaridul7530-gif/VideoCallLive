
name: Build Video Call Live V36 Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V36 project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q VideoCallLiveV36_DESIGN.zip -d extracted

          PROJECT_DIR="$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleRelease

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Sign release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          UNSIGNED_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED_APK"
          mkdir -p signed

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            "$UNSIGNED_APK" signed/VideoCallLiveV36-aligned.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed/VideoCallLiveV36.apk \
            signed/VideoCallLiveV36-aligned.apk

      - name: Verify signed APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose signed/VideoCallLiveV36.apk

      - name: Upload V36 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLiveV36-Signed-APK
          path: signed/VideoCallLiveV36.apk
          if-no-files-found: error

name: Build Video Call Live V10 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V10 project
        run: |
          unzip -q VideoCallLiveV10_POLISHED_UI.zip -d buildproject
          cp google-services.json buildproject/VideoCallLiveV10_POLISHED_UI/app/google-services.json
          ls -la buildproject/VideoCallLiveV10_POLISHED_UI

      - name: Build V10 APK
        working-directory: buildproject/VideoCallLiveV10_POLISHED_UI
        run: gradle :app:assembleDebug

      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV10_POLISHED_UI
        run: gradle signingReport

      - name: Upload V10 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V10-APK
          path: buildproject/VideoCallLiveV10_POLISHED_UI/app/build/outputs/apk/debug/app-debug.apk

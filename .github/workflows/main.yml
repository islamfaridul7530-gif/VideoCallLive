name: Build Video Call Live APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

          

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2 project
        run: |
          unzip -q VideoCallLiveV2_Firebase.zip -d buildproject
                    cp google-services.json buildproject/VideoCallLiveV2/app/google-services.json

      - name: Build APK
        working-directory: buildproject/VideoCallLiveV2
        run: gradle :app:assembleDebug
      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV2
        run: gradle signingReport
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V2-APK
          path: buildproject/VideoCallLiveV2/app/build/outputs/apk/debug/app-debug.apk

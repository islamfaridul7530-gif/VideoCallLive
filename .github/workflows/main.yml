name: Build VideoCallLive V42 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Give Gradle permission
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Rename V42 APK
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi
          cp "$APK" VideoCallLive-V42.apk

      - name: Upload V42 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V42
          path: VideoCallLive-V42.apk
          if-no-files-found: error
          retention-days: 30

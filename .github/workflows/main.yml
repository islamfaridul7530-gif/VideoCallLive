name: Build Video Call Live V17 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V17 project
        run: |
          unzip -q VideoCallLiveV17_REAL_PROFILE_FOUNDATION.zip -d buildproject
          cp google-services.json buildproject/VideoCallLiveV17_REAL_PROFILE_FOUNDATION/app/google-services.json
          ls -la buildproject/VideoCallLiveV17_REAL_PROFILE_FOUNDATION

      - name: Build V17 APK
        working-directory: buildproject/VideoCallLiveV17_REAL_PROFILE_FOUNDATION
        run: gradle :app:assembleDebug

      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV17_REAL_PROFILE_FOUNDATION
        run: gradle signingReport

      - name: Upload V17 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V17-APK
          path: buildproject/VideoCallLiveV17_REAL_PROFILE_FOUNDATION/app/build/outputs/apk/debug/app-debug.apk

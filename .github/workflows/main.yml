
name: Build Video Call Live V20 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VideoCallLiveV20_REAL_VIDEO_CALL.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract V20 project
        run: |
          mkdir -p buildproject
          unzip -q VideoCallLiveV20_REAL_VIDEO_CALL.zip -d buildproject

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Configure release signing
        working-directory: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          code = p.read_text()

          assert "android {" in code, "Android block not found"
          assert "signingConfigs" not in code, "Signing config already exists"
          assert "buildTypes" not in code, "Build types already exist"

          signing = """
           signingConfigs {
            release {
             storeFile file(System.getenv("KEYSTORE_PATH"))
             storePassword System.getenv("KEYSTORE_PASSWORD")
             keyAlias System.getenv("KEY_ALIAS")
             keyPassword System.getenv("KEY_PASSWORD")
            }
           }

           buildTypes {
            release {
             signingConfig signingConfigs.release
            }
           }

          """

          code = code.replace("android {", "android {\\n" + signing, 1)
          p.write_text(code)
          print("Release signing configuration added.")
          PY

      - name: Build signed Release APK
        working-directory: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          gradle assembleRelease --stacktrace

      - name: Verify signed APK
        working-directory: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V20-Signed-Release-APK
          path: buildproject/VideoCallLiveV20_REAL_VIDEO_CALL/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

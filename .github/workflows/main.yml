
name: Build Video Call Live V30 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'VideoCallLiveV30_REAL_CHAT_VIDEO.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract V30 project
        shell: bash
        run: |
          set -e
          test -f VideoCallLiveV30_REAL_CHAT_VIDEO.zip

          mkdir -p buildproject
          unzip -q VideoCallLiveV30_REAL_CHAT_VIDEO.zip -d buildproject

          PROJECT_DIR="buildproject/VideoCallLiveV28_CALL_AUDIO"

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/settings.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Configure release signing
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          code = p.read_text()

          assert "android {" in code, "Android configuration not found"

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          """

          code = code.replace(
              "android {",
              "android {\n" + signing,
              1
          )

          p.write_text(code)
          print("Release signing configured.")
          PY

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace

      - name: Verify signed APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          ls -lh "$APK"

      - name: Upload V30 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V30-Signed-APK
          path: buildproject/VideoCallLiveV28_CALL_AUDIO/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

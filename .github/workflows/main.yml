name: Build Video Call Live V11 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V11 project
        run: |
          unzip -q VideoCallLiveV11_CREATOR_PROFILE_FIX.zip -d buildproject
          cp google-services.json buildproject/VideoCallLiveV11_CREATOR_PROFILE_FIX/app/google-services.json
          ls -la buildproject/VideoCallLiveV11_CREATOR_PROFILE_FIX

      - name: Build V11 APK
        working-directory: buildproject/VideoCallLiveV11_CREATOR_PROFILE_FIX
        run: gradle :app:assembleDebug

      - name: Show SHA1
        working-directory: buildproject/VideoCallLiveV11_CREATOR_PROFILE_FIX
        run: gradle signingReport

      - name: Upload V11 APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V11-APK
          path: buildproject/VideoCallLiveV11_CREATOR_PROFILE_FIX/app/build/outputs/apk/debug/app-debug.apk

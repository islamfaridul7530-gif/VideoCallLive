          echo "AAB found: $AAB"

      - name: Restore signing keystore
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Sign APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" signed/VideoCallLive-V58-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign             --ks "$RUNNER_TEMP/release.keystore"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out signed/VideoCallLive-V58.apk             signed/VideoCallLive-V58-aligned.apk

      - name: Sign Android App Bundle
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp "$UNSIGNED_AAB" signed/VideoCallLive-V58.aab
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" signed/VideoCallLive-V58.aab "$KEY_ALIAS"

      - name: Verify signed Android App Bundle
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -verbose signed/VideoCallLive-V58.aab > /tmp/aab-verify.txt 2>&1
          cat /tmp/aab-verify.txt | tail -30
          if ! grep -qi "jar verified" /tmp/aab-verify.txt; then
            echo "ERROR: jarsigner did not confirm the AAB signature"
            exit 1
          fi
          echo "AAB signature verified"


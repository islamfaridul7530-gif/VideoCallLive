name: Patch Android account rules and build test APK

on:
  pull_request:
    branches: [main]
    paths:
      - "VideoCallLive-PAYMENT-TEST-15-FINAL.zip"
      - ".github/workflows/patch-android-test.yml"
      - ".github/scripts/patch_android.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract and patch Android source
        run: |
          set -euo pipefail
          rm -rf android-work
          mkdir android-work
          unzip -q VideoCallLive-PAYMENT-TEST-15-FINAL.zip -d android-work
          PROJECT="$(find android-work -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          python3 .github/scripts/patch_android.py "$PROJECT"
          echo "$PROJECT" > /tmp/android-project-path

      # Reuse the same Android debug signing key across builds. Without this,
      # GitHub-hosted runners generate a new key each run and APK updates fail.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: videocalllive-android-debug-keystore-v1

      - name: Ensure debug signing key exists
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK and report package/signature
        run: |
          set -euo pipefail
          PROJECT="$(cat /tmp/android-project-path)"
          cd "$PROJECT"
          gradle --no-daemon assembleDebug
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$GITHUB_WORKSPACE/test-apk"
          cp "$APK" "$GITHUB_WORKSPACE/test-apk/VideoCallLive-test-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          echo "=== APK package/version ==="
          "$AAPT" dump badging "$APK" | head -n 1
          echo "=== APK signing certificate ==="
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-test-debug-APK
          path: test-apk/VideoCallLive-test-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Patch Android account rules and build signed APK

on:
  pull_request:
    branches: [main]
    paths:
      - "VideoCallLive-PAYMENT-TEST-15-FINAL.zip"
      - ".github/workflows/patch-android-test.yml"
      - ".github/scripts/patch_android.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract and patch Android source
        run: |
          set -euo pipefail
          rm -rf android-work
          mkdir android-work
          unzip -q VideoCallLive-PAYMENT-TEST-15-FINAL.zip -d android-work
          PROJECT="$(find android-work -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT"
          python3 .github/scripts/patch_android.py "$PROJECT"
          echo "$PROJECT" > /tmp/android-project-path

      - name: Build release APK
        run: |
          set -euo pipefail
          PROJECT="$(cat /tmp/android-project-path)"
          cd "$PROJECT"
          gradle --no-daemon clean assembleRelease
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "UNSIGNED_APK=$GITHUB_WORKSPACE/$PROJECT/$APK" >> "$GITHUB_ENV"

      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Align and sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          mkdir -p "$GITHUB_WORKSPACE/signed"

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4             "$UNSIGNED_APK"             "$GITHUB_WORKSPACE/signed/VideoCallLive-V44-aligned.apk"

          "$BUILD_TOOLS_DIR/apksigner" sign             --ks "$RUNNER_TEMP/release.keystore"             --ks-pass "pass:$KEYSTORE_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --key-pass "pass:$KEY_PASSWORD"             --out "$GITHUB_WORKSPACE/signed/VideoCallLive-V44.apk"             "$GITHUB_WORKSPACE/signed/VideoCallLive-V44-aligned.apk"

      - name: Verify package, version and signing certificate
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS_DIR/aapt"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          echo "=== APK package/version ==="
          "$AAPT" dump badging "$GITHUB_WORKSPACE/signed/VideoCallLive-V44.apk" | head -n 1

          echo "=== APK signing certificate ==="
          "$APKSIGNER" verify --verbose --print-certs "$GITHUB_WORKSPACE/signed/VideoCallLive-V44.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoCallLive-V44-SIGNED-APK
          path: signed/VideoCallLive-V44.apk
          if-no-files-found: error
          retention-days: 30

name: Validate VideoCallLive privacy draft

on:
  push:
    branches:
      - privacy-account-deletion
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/main.yml"); puts "main.yml YAML syntax OK"'
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/deploy-functions.yml"); puts "deploy-functions.yml YAML syntax OK"'

      - name: Validate privacy contact and account deletion files
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'videocalllive7530support@gmail.com' docs/PRIVACY-POLICY.md
          grep -q 'videocalllive7530support@gmail.com' docs/DELETE-ACCOUNT.md
          grep -q 'exports.deleteMyAccount' functions/index.js
          grep -q 'AccountDeletionActivity' v45_patch/app/src/main/AndroidManifest.xml
          grep -q 'versionCode 54' <(grep -n 'versionCode 53' v45_patch/app/build.gradle || true) && exit 1 || true
          echo "Privacy contact and account-deletion source checks passed."
